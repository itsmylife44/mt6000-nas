<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAS Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="app-shell" class="app-shell hidden">
    <button type="button" class="hamburger" id="hamburger" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="7" rx="1"/><rect x="2" y="14" width="20" height="7" rx="1"/>
          <circle cx="18" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          <circle cx="18" cy="17.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="brand-name">NAS</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-item" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#/files" class="nav-item" data-view="files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
          </svg>
          <span>Files</span>
        </a>
        <a href="#/samba" class="nav-item" data-view="samba">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <path d="M7 15h3m4 0h3M7 11h2m4 0h2m-7 0h1"/>
            <circle cx="12" cy="11" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <span>Samba</span>
        </a>
        <a href="#/users" class="nav-item" data-view="users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/>
            <path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/>
          </svg>
          <span>Users</span>
        </a>
        <a href="#/logs" class="nav-item" data-view="logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
          <span>Logs</span>
        </a>
        <a href="#/shares" class="nav-item" data-view="shares">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          <span>Shares</span>
        </a>
        <a href="#/backups" class="nav-item" data-view="backups">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/>
            <polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/>
          </svg>
          <span>Backups</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info" id="user-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0116 0v2"/>
          </svg>
          <span id="username-display">admin</span>
        </div>
        <button type="button" class="btn-logout" id="logout-btn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <div id="app"></div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <div id="login-modal" class="modal-backdrop">
    <div class="modal modal-login">
      <div class="modal-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="20" height="7" rx="1"/><rect x="2" y="14" width="20" height="7" rx="1"/>
            <circle cx="18" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            <circle cx="18" cy="17.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <h2>NAS Dashboard</h2>
        <p class="login-subtitle">Sign in to continue</p>
      </div>
      <form id="login-form" class="modal-body">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required placeholder="admin">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-submit">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/files.js"></script>
  <script src="/static/js/samba.js"></script>
  <script src="/static/js/users.js"></script>
  <script src="/static/js/logs.js"></script>
  <script src="/static/js/shares.js"></script>
  <script src="/static/js/backups.js"></script>
</body>
</html>
